name: CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  laravel-tests:
    name: PHP Tests & Code Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: Salu_exam_portal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: Salu_exam_portal
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, bcmath, gd, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate App Key
        run: php artisan key:generate

      - name: Create Test Database
        run: PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres Salu_exam_portal_test

      - name: Run Migrations & Seeds
        run: php artisan migrate:fresh --seed --force

      - name: Migrate Test Database
        run: DB_DATABASE=Salu_exam_portal_test php artisan migrate:fresh --force

      - name: Execute Tests (PHPUnit)
        run: php artisan test
