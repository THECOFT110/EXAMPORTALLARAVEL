services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salu_exam_portal_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage/app/public:/var/www/html/storage/app/public
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-Salu_exam_portal}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    networks:
      - salu_network
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: salu_exam_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-Salu_exam_portal}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - salu_network

  redis:
    image: redis:alpine
    container_name: salu_exam_portal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - salu_network

networks:
  salu_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
